<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vue-component-graph — __TITLE__</title>
<style>/*__CSS__*/</style>
</head>
<body>
<div class="viz-root" id="app">
  <header class="bar">
    <div class="brand">
      <strong>vue-component-graph</strong>
      <span class="root" id="root-path"></span>
    </div>
    <div class="search">
      <input id="search" type="search" placeholder="" data-i18n-placeholder="searchPlaceholder" autocomplete="off" spellcheck="false">
      <ul id="search-results" class="results" role="listbox" hidden></ul>
    </div>
    <div class="tools">
      <label data-i18n-title="optScriptTitle"><input type="checkbox" id="opt-script" checked> <span data-i18n="optScript"></span></label>
      <label id="opt-impact-wrap" data-i18n-title="optImpactTitle" hidden><input type="checkbox" id="opt-impact" checked> <span data-i18n="optImpact"></span></label>
      <label data-i18n-title="optModulesTitle"><input type="checkbox" id="opt-modules" checked> <span data-i18n="optModules"></span></label>
      <label id="opt-shared-wrap"><input type="checkbox" id="opt-shared"> <span data-i18n="optShared"></span></label>
      <label data-i18n-title="optGroupsTitle"><input type="checkbox" id="opt-groups"> <span data-i18n="optGroups"></span></label>
      <button id="btn-fit" type="button" data-i18n="fit" data-i18n-title="fitTitle"></button>
      <button id="btn-lang" type="button" data-i18n-title="langTitle"></button>
    </div>
  </header>
  <div class="focus-bar" id="focus-bar" hidden></div>
  <main>
    <svg id="canvas" data-i18n-label="canvas">
      <defs>
        <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
          <path d="M0,0.5 L7.5,4 L0,7.5 z" class="arrow"></path>
        </marker>
        <marker id="arrow-hi" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
          <path d="M0,0.5 L7.5,4 L0,7.5 z" class="arrow-hi"></path>
        </marker>
        <marker id="arrow-cycle" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
          <path d="M0,0.5 L7.5,4 L0,7.5 z" class="arrow-cycle"></path>
        </marker>
      </defs>
      <g id="viewport">
        <g id="edges"></g>
        <g id="nodes"></g>
      </g>
    </svg>
    <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
    <div class="legend" id="legend"></div>
    <aside class="side" id="side"></aside>
  </main>
</div>
<script type="application/json" id="graph-data">__DATA__</script>
<script>/*__JS__*/</script>
</body>
</html>
